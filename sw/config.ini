; Parameter game Jump-to-Flap.
; Dibaca oleh model PC (tools/game_model.py) dan nanti oleh aplikasi C di PS.
; Satuan: piksel dan frame (1 frame = 1/60 detik). Disimpan di game sebagai
; fixed-point x256 (lihat FP di game_model.py).
;
; Ditala untuk ritme lompatan manusia: satu lompatan ~0,6-1 detik (36-60 frame),
; jauh lebih lambat dari ketukan jari di Flappy Bird asli.

[physics]
; percepatan ke bawah, piksel/frame^2
gravity = 0.12
; kecepatan ke atas yang diset saat flap, piksel/frame
flap_velocity = 3.0
; batas kecepatan jatuh, piksel/frame
max_fall_speed = 5.0

[pipes]
; kecepatan geser pipa, piksel/frame (1.5 = 90 px/detik)
pipe_speed = 1.5
; jarak horizontal antarpipa, piksel
pipe_spacing = 300
; tinggi celah, piksel
gap_h = 170
; lebar batang pipa, piksel
pipe_width = 64
; perubahan maksimum posisi celah dari pipa sebelumnya (manusia lambat bereaksi)
max_gap_delta = 110
; seed generator acak pipa (deterministik, sama di PC dan PS)
seed = 12345

[bird]
bird_x = 160
; hitbox lebih kecil dari sprite 32x32 agar terasa adil
hitbox_margin = 5
; 1 = menyentuh atas layar = game over; 0 = burung hanya tertahan di atas
ceiling_kills = 0

[input]
; tunda setiap flap, untuk merasakan efek latensi kamera
input_latency_ms = 0
; jeda minimal antar-flap (meniru detektor yang menunggu mendarat)
min_flap_interval_ms = 0
